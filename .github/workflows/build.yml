name: Build

on:
  push:
    branches:
      - main
    tags:
      - '**'
  # This standard PR trigger deliberately includes Dependabot pull requests.
  # Dependency updates must run the same validation job as every other PR.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      dry_run_publish:
        description: Push packed packages to a runner-local feed after consumer validation
        required: true
        default: true
        type: boolean
      version:
        description: Optional package version override for manual runs (e.g. 2.0.0)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate .NET 10 and .NET 11
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up validation matrix
      uses: ./.github/actions/setup-melt-dotnet
    - name: Format, build, and test
      run: pwsh ./build.ps1
  pack:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up validation matrix
      uses: ./.github/actions/setup-melt-dotnet
    - name: Determine version
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
          version="${INPUT_VERSION#v}"
        else
          version="$(git describe --tags --dirty | sed 's/^v//')"
        fi
        if [ -z "$version" ] || [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid package version: '$version'" >&2
          exit 1
        fi
        echo "Resolved package version: $version"
        echo "VERSION=$version" >> "$GITHUB_ENV"
    - name: Pack
      run: dotnet pack --output ./artifacts --configuration Release "-p:Version=$VERSION" MELT.sln
    - name: Verify package artifacts and Source Link
      run: |
        commit="$(git rev-parse HEAD)"
        dotnet run --project test/PackageArtifactVerifier/PackageArtifactVerifier.csproj -- --package-dir ./artifacts --expected-commit "$commit" --require-deterministic-paths
    - name: Audit direct and transitive dependencies
      shell: pwsh
      run: ./\.github/scripts/test-vulnerable-dependencies.ps1 -ReportPath ./artifacts/vulnerability-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: ./artifacts
  consumer-smoke:
    name: Test packed packages as consumers
    runs-on: ubuntu-latest
    needs: pack
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up validation matrix
      uses: ./.github/actions/setup-melt-dotnet
    - uses: actions/download-artifact@v4
      with:
        name: artifacts
        path: ./artifacts
    - name: Restore and run package consumers
      shell: pwsh
      run: ./\.github/scripts/test-packed-consumers.ps1 -PackageDirectory ./artifacts
  dry-run-publish:
    name: Dry-run package publishing
    runs-on: ubuntu-latest
    needs: consumer-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run_publish
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up validation matrix
      uses: ./.github/actions/setup-melt-dotnet
    - uses: actions/download-artifact@v4
      with:
        name: artifacts
        path: ./artifacts
    - name: Dry-run package publishing
      run: |
        mkdir ./dry-run-feed
        dotnet nuget push "./artifacts/*.nupkg" --source "$PWD/dry-run-feed" --skip-duplicate
        expected=$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' | wc -l)
        pushed=$(find ./dry-run-feed -type f -name '*.nupkg' | sort)
        printf '%s\n' "$pushed"
        actual=$(printf '%s\n' "$pushed" | sed '/^$/d' | wc -l)
        test "$expected" -gt 0 && test "$actual" -eq "$expected"
  publish:
    runs-on: ubuntu-latest
    needs: consumer-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up validation matrix
      uses: ./.github/actions/setup-melt-dotnet
    - uses: actions/download-artifact@v4
      with:
        name: artifacts
        path: ./artifacts
    - name: NuGet Login
      id: login
      uses: NuGet/login@v1
      with:
        user: AleFranz
    - name: Publish packages
      run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
